# Homophily-assuming control for the heterophily-aware model (SRS FR-5).
#
# Per CONVENTIONS.md §4 this is a copy of heterophily_gnn_hismall.yaml, NOT a
# reuse of it: everything below is held identical except model.type, so any
# difference in the results is attributable to the architecture rather than to
# hyperparameters. Same graph, same temporal splits, same seed, same loss,
# same width/depth, same explain settings.
#
# Why it matters: SRS §174 states the success criterion as "heterophily-aware
# model achieves measurably better recall/F1 on the illicit class than the
# homophily baseline", and the §211 risk row allows "no improvement over
# baseline" as a valid negative result — but only if FR-5's baseline is
# actually included. Without this run neither outcome can be claimed.

# NOT 'sage_hismall_baseline': that is a substring of the heterophily run's
# 'heterosage_hismall_baseline', so any glob over outputs/ would match both.
run_id_prefix: sagebaseline_hismall_control

dataset:
  name: hismall  # HI-Small — locked in (see SRS §1.2 "Dataset selection")
  trans_path: data/raw/HI-Small_Trans.csv
  accounts_path: data/raw/HI-Small_accounts.csv
  patterns_path: data/raw/HI-Small_Patterns.txt

# No subsample block: this runs on the full 5,078,345-edge graph, so it reuses
# data/processed/hismall_* — the same artifacts the heterophily run consumes.

# "auto" uses CUDA when a GPU is present (e.g. a Colab T4) and falls back to
# CPU otherwise. Pin explicitly with "cpu" / "cuda:0" if you need to.
device: auto

seed: 42

split:
  train_frac: 0.6
  val_frac: 0.2
  # test_frac is the remainder (0.2)

model:
  # THE ONLY LINE THAT DIFFERS from heterophily_gnn_hismall.yaml.
  # BaselineSAGE averages self and neighbours together (homophily assumption);
  # HeterophilyGNN keeps self / in-neighbour / out-neighbour signal separate.
  type: baseline_sage
  hidden_dim: 64
  num_layers: 2

train:
  # 100 was not enough: in the 6-run sweep both train and val AUPRC were still
  # rising monotonically at epoch 100 and loss was still falling.
  epochs: 300
  lr: 0.001
  weight_decay: 0.00001
  log_every: 10

loss:
  type: weighted_ce  # or focal
  # pos_weight is computed automatically from the train split (see
  # src/training/losses.py:compute_pos_weight) unless overridden here:
  # pos_weight: null

explain:
  explain_epochs: 200
  # Matches the heterophily config so fidelity tables are comparable.
  per_typology_cap: 50   # SRS FR-8: cap sampled true positives per typology
  top_k_edges: 6         # SRS FR-11: edges kept when scoring fidelity
  save_subgraph_figures: true  # SRS FR-12 / CONVENTIONS.md §5
